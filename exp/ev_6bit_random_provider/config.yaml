model:
  name: gtranqem
  use_only_global: False
  use_global_features: True
  use_gate_type: True
  use_qubit_index: True
  use_T1T2: True
  use_gate_error: True
  use_gate_index: True
  num_layers: 2
  input_dim: 40
  hidden_dim: 64
num_epochs: 60
batch_size: 32
data_path: '/tmp/standard/max_6q/random/provider/dataset'
num_qubits: 6
exp_type: intra
train_size: 750
valid_size: 150
test_size: 300

criterion:
  name: mse

optimizer:
  name: adam
  lr: 5.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: constant

pdb: False

device: gpu
